  <!-- Fragment shader program -->
  <script id="shader-fs" type="x-shader/x-fragment">
  varying mediump vec3 vDirection;
  uniform mediump float eye;
  uniform mediump float projection;
  uniform sampler2D uSampler;
  #define PI 3.1415926535897932384626433832795
  mediump vec4 directionToColor(mediump vec3 direction, mediump float eye, mediump float projection) {
    mediump float theta = atan(direction.x, -1.0 * direction.z);
    mediump float phi = atan(direction.y, length(direction.xz));
    if (abs(direction.x) < 1e-4 * abs(direction.z))
    theta = 0.5*PI * (1.0 - sign(-1.0 * direction.z));
    if (abs(direction.y) < 1e-4 * length(direction.xz))
    phi = 0.0;
    if (projection == 0.) {
      return texture2D(uSampler, vec2(mod(theta / (2.0*PI), 1.0), phi / PI + 0.5));
    } else {
      eye = 1. - eye;
      return texture2D(uSampler, vec2(mod(theta / (2.0*PI), 1.0), ((phi / PI + 0.5) + eye)/ 2.));
    }
  }
  void main(void) {
    gl_FragColor = directionToColor(vDirection, eye, projection);
  }
</script>
<!-- Vertex shader program -->
<script id="shader-vs" type="x-shader/x-vertex">
  attribute mediump vec2 aVertexPosition;
  uniform mediump mat4 proj_inv;
  varying mediump vec3 vDirection;
  void main(void) {
    gl_Position = vec4(aVertexPosition, 1.0, 1.0);
    mediump vec4 projective_direction = proj_inv * gl_Position;
    vDirection = projective_direction.xyz / projective_direction.w;
  }
</script>
<link rel="stylesheet" href="css/font-awesome.css">
<link rel="stylesheet" href="css/elevr-player.css">

<style>
/* ========== 全局基础样式｜迷体元宇 科幻风格 ========== */
*{
  box-sizing: border-box;
}
html,body{
  margin:0;
  padding:0;
  background:#050810;
  overflow:hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
#video-container{
  width:100vw;
  height:100vh;
  position:relative;
}
/* 扫描线微弱背景纹理，不遮挡视频 */
#video-container::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  background-image: linear-gradient(rgba(0,190,255,0.03) 1px, transparent 1px);
  background-size:100% 24px;
  opacity:0.35;
}
/* ========== 控制面板｜自动隐藏核心样式 ========== */
#video-controls {
  position:absolute;
  bottom:24px;
  left:50%;
  transform: translateX(-50%);
  z-index:10;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(6, 14, 28, 0.62);
  border: 1px solid rgba(0, 200, 255, 0.35);
  border-radius: 14px;
  box-shadow: 0 0 22px rgba(0, 200, 255, 0.14), inset 0 0 14px rgba(0, 200, 255, 0.05);
  /* 自动隐藏动画 */
  opacity:1;
  visibility:visible;
  transition: opacity 0.4s ease, visibility 0.4s;
  /* 移动端强制显示，不会被挤没 */
  white-space:nowrap;
  padding:6px 10px;
}
#video-controls.hidden-ui{
  opacity:0;
  visibility:hidden;
}
/* 图标基础样式+hover发光交互 */
#video-controls .icon {
  color: #bcf2ff;
  text-shadow: 0 0 6px rgba(0, 200, 255, 0.45);
  transition: 0.22s ease;
  font-size:16px !important;
  margin:0 3px;
}
#video-controls .icon:hover {
  color: #ffffff;
  text-shadow: 0 0 16px rgba(0, 200, 255, 0.9);
}
/* 进度条样式 */
#seek-bar {
  accent-color: #00c8ff;
  width:100px;
}
#seek-bar::-webkit-slider-thumb {
  box-shadow: 0 0 9px #00c8ff;
  transition: 0.2s;
}
#seek-bar::-webkit-slider-thumb:hover {
  box-shadow: 0 0 18px #00c8ff;
}
/* 下拉选择框 */
#projection-select, #video-select {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: rgba(9, 17, 31, 0.65);
  color: #bcf2ff;
  border: 1px solid rgba(0, 200, 255, 0.32);
  outline: none;
  transition: 0.22s;
  font-size:12px;
  padding:2px;
  margin:0 3px;
}
#projection-select:focus, #video-select:focus {
  border-color: #00c8ff;
  box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
}
#projection-select option, #video-select option {
  background: #091220;
}
/* URL输入框 */
#video-url-input {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: rgba(9, 17, 31, 0.65);
  color: #fff;
  border: 1px solid rgba(0, 200, 255, 0.32);
  outline: none;
  transition: 0.22s;
  font-size:12px;
  width:110px;
  padding:2px;
  margin:0 3px;
}
#video-url-input:focus {
  border-color: #00c8ff;
  box-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
}
#video-url-input::placeholder {
  color: #7288a8;
}
/* 加载按钮 */
#load-url-btn {
  background: rgba(0, 200, 255, 0.75);
  color: #04101b;
  border: none;
  transition: 0.22s ease;
  box-shadow: 0 0 7px rgba(0, 200, 255, 0.4);
  font-weight: 500;
  font-size:12px;
  padding:2px 4px;
  margin:0 3px;
}
#load-url-btn:hover {
  background: #00c8ff;
  box-shadow: 0 0 16px rgba(0, 200, 255, 0.85);
}
/* 提示文字 */
#tip {
  text-shadow: 0 0 6px rgba(0, 200, 255, 0.55);
  font-size:11px;
  margin:0 4px;
}
/* ========== 加载页标题与中央播放按钮｜迷体元宇风格 ========== */
.title {
  color: #87eaff;
  text-shadow: 0 0 12px rgba(0, 200, 255, 0.7), 0 0 24px rgba(0,200,255,0.3);
  letter-spacing: 2px;
}
.message {
  color: #b0c8e8;
  opacity:0.8;
  letter-spacing:1px;
}
.large-play {
  color: #87eaff;
  text-shadow: 0 0 20px rgba(0, 200, 255, 0.8), 0 0 36px rgba(0,200,255,0.4);
  transition: 0.25s;
}
.large-play:hover {
  color: #fff;
  text-shadow: 0 0 30px rgba(0, 200, 1), 0 0 50px rgba(0,200,255,0.55);
}
</style>
</head>
<body>
  <div id="video-container">
    <!-- Loading Message -->
    <div id="left-load" class="left">
      <div id="title-l" class="title">迷体元宇 · 加载中</div>
      <div id="message-l" class="message hidden">WASD 移动视角｜Q/E 俯仰</div>
    </div>
    <div id="right-load" class="right">
      <div id="title-r" class="title">迷体元宇 · 加载中</div>
      <div id="message-r" class="message hidden">WASD 移动视角｜Q/E 俯仰</div>
    </div>
    <div id="left-play" class="left hidden">
      <a id="play-l" class="large-play fa fa-play fa-5x"></a>
    </div>
    <div id="right-play" class="right hidden">
      <a id="play-r" class="large-play fa fa-play fa-5x"></a>
    </div>
    <canvas id="glcanvas">
      Your browser doesn't appear to support the HTML5 <code>&lt;canvas&gt;</code> element.
    </canvas>
    <video class="hidden" preload="auto" id="video" loop="true" webkit-playsinline crossOrigin="anonymous">
      <source src="https://cdn.pixabay.com/video/2023/09/24/182082-867762198_large.mp4" type="video/mp4">
      <source src="therelaxatron.webm" type="video/webm">
    </video>
        <!-- Video Controls -->
        <div id="video-controls" class="hidden">
          <a id="play-pause" class="fa fa-play icon" title="Play"></a>
          <input type="range" id="seek-bar" value="0">
          <a id="loop" class="fa fa-chain-broken icon" title="Stop Looping"></a>
          <a id="mute" class="fa fa-volume-up icon" title="Mute"></a>
          <a id="recenter" class="fa fa-dot-circle-o icon" title="Recenter"></a>
          <a id="select-local-file" class="fa fa-folder-open icon" title="Select File"></a>
          <!-- 投影下拉 -->
          <select id="projection-select">
            <option value=0>星球模式</option>
            <option value=1>星球MAX 3D</option>
          </select>
          <!-- 视频下拉（本地预设视频） -->
          <select id="video-select">
            <option value="https://cdn.pixabay.com/video/2021/09/27/89894-616430996_large.mp4">衍镜模式 (mp4)</option>
            <option value="0therelaxatron.webm">衍镜模式 (webm)</option>
            <option value="https://cdn.pixabay.com/video/2021/09/27/89894-616430996_large.mp4">迷体模式 (mp4)</option>
            <option value="1Vidcon.webm">迷体模式 (webm)</option>
          </select>
          <!-- URL输入框，小尺寸适配手机 -->
          <input type="text" id="video-url-input" placeholder="URL">
          <button id="load-url-btn">加载</button>
          <span id="tip"></span>
          <!-- 全屏按钮，支持iOS+安卓，修复移动端无法全屏 -->
          <a id="full-screen" class="fa fa-expand icon" title="Full Screen"></a>
        </div>
        <script>runEleVRPlayer();</script>
  </div>
<script>
const videoSel = document.getElementById('video-select');
const video = document.getElementById('video');
const urlInput = document.getElementById('video-url-input');
const loadBtn = document.getElementById('load-url-btn');
const tipDom = document.getElementById('tip');
const controlPanel = document.getElementById('video-controls');
const container = document.getElementById('video-container');
const fullscreenBtn = document.getElementById('full-screen');
// 代理地址
const PROXY_BASE = "https://b.miti1.cc.cd/?url=";

// ========== 下拉框逻辑，自动走CORS代理 ==========
videoSel.addEventListener('change', function(){
  const rawUrl = this.value;
  const proxiedUrl = PROXY_BASE + encodeURIComponent(rawUrl);
  video.src = proxiedUrl;
  video.load();
});

// ========== URL加载函数，自动加代理解决跨域 ==========
function loadVideoSrc(srcUrl){
  tipDom.innerText = "加载中";
  const proxiedUrl = PROXY_BASE + encodeURIComponent(srcUrl);
  video.src = proxiedUrl;
  video.load();
  video.oncanplay = function(){
    tipDom.innerText = "就绪，点播放";
  }
  video.onerror = function(){
    tipDom.innerText = "失败！CORS/链接错误";
  }
}
// 按钮点击加载
loadBtn.addEventListener('click', function(){
  const url = urlInput.value.trim();
  if(!url){
    tipDom.innerText = "空链接";
    return;
  }
  loadVideoSrc(url);
});
// 回车加载
urlInput.addEventListener('keydown',function(e){
  if(e.key === 'Enter'){
    loadBtn.click();
  }
})

// ========== 新增：兼容iOS Safari /安卓浏览器全屏API ==========
let isFull = false;
fullscreenBtn.addEventListener('click', async ()=>{
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement){
      // iOS Safari
      if(container.webkitRequestFullscreen){
        container.webkitRequestFullscreen();
      }else if(container.requestFullscreen){
        container.requestFullscreen();
      }
      fullscreenBtn.className = "fa fa-compress icon";
    }else{
      if(document.webkitExitFullscreen){
        document.webkitExitFullscreen();
      }else if(document.exitFullscreen){
        document.exitFullscreen();
      }
      fullscreenBtn.className = "fa fa-expand icon";
    }
  }catch(err){
    tipDom.innerText="全屏不支持";
  }
});
// 监听全屏状态变化，切换图标
document.addEventListener('fullscreenchange', updateFullIcon);
document.addEventListener('webkitfullscreenchange', updateFullIcon);
function updateFullIcon(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    fullscreenBtn.className = "fa fa-compress icon";
  }else{
    fullscreenBtn.className = "fa fa-expand icon";
  }
}

// ========== 控制面板自动隐藏逻辑｜鼠标静止3秒隐藏 ==========
let uiHideTimer;
const UI_HIDE_DELAY = 3000;
function showControls(){
  controlPanel.classList.remove('hidden-ui');
  clearTimeout(uiHideTimer);
  // 只有视频播放状态才启动自动隐藏
  uiHideTimer = setTimeout(()=>{
    controlPanel.classList.add('hidden-ui');
  }, UI_HIDE_DELAY);
}
// 鼠标移动 / 触屏 显示面板
container.addEventListener('mousemove', showControls);
container.addEventListener('touchstart', showControls);
container.addEventListener('touchmove', showControls);
// 初始化
showControls();
</script>
</body>
</html>
